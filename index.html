<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectra Week Voting System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-name">Spectra</div>
          <div class="brand-sub">Spectra Week</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="small-muted" id="voting-as"></span>
        <button class="btn btn-outline btn-sm" id="change-name-btn" style="display:none;">Not you?</button>
        <a class="nav-link" href="admin.html">Admin</a>
      </div>
    </header>

    <h1 class="page-title">Spectra <span class="accent">Week</span> Voting System</h1>
    <p class="page-subtitle" id="page-subtitle">Enter your full name to vote. One vote per person, per category.</p>

    <div id="name-step" class="card" style="display:none; max-width:440px;">
      <label class="field-label" for="name-input">Your full name</label>
      <input class="input" type="text" id="name-input" placeholder="e.g. Mercy Idubor" autocomplete="name" />
      <div class="error-text" id="name-error"></div>
      <button class="btn btn-gold" id="start-voting-btn" style="margin-top:12px; width:100%;">Start voting</button>
      <p class="small-muted" style="margin-top:12px; margin-bottom:0;">
        Your name is recorded with your vote so nobody votes twice. Please use
        the full name your colleagues know you by.
      </p>
    </div>

    <div id="categories"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
